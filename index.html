<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課堂即時反饋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui; }
    .success { display: none; }
  </style>
</head>
<body class="bg-blue-50 min-h-screen py-10">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-xl">
    <h1 class="text-2xl font-bold text-center text-blue-700 mb-1">📚 課堂即時反饋</h1>
    <p class="text-center text-gray-400 text-sm mb-8">填完後老師會即時看到，請放心填寫！</p>

    <form id="surveyForm" class="space-y-7">

      <div>
        <label class="block text-sm font-semibold mb-2">姓名</label>
        <input name="姓名" type="text" required
          class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500"
          placeholder="請輸入你的姓名">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">今天課程的理解程度</label>
        <div class="flex gap-3 flex-wrap">
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="理解程度" value="5" required class="sr-only"> 😄<br><span class="text-xs">完全理解</span>
          </label>
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="理解程度" value="4" class="sr-only"> 🙂<br><span class="text-xs">大致理解</span>
          </label>
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="理解程度" value="3" class="sr-only"> 😐<br><span class="text-xs">有點模糊</span>
          </label>
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="理解程度" value="2" class="sr-only"> 😕<br><span class="text-xs">不太懂</span>
          </label>
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="理解程度" value="1" class="sr-only"> 😵<br><span class="text-xs">完全不懂</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">今天最難理解的概念是？</label>
        <input name="最難的概念" type="text"
          class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500"
          placeholder="例如：某個公式、某個定義">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-2">想問老師的問題</label>
        <textarea name="想問的問題" rows="3"
          class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-blue-500"
          placeholder="可以匿名，盡量寫！"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-3">今天的課程節奏</label>
        <div class="flex gap-3">
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="課程節奏" value="太快" required class="sr-only"> 🏃 太快
          </label>
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-green-50 has-[:checked]:bg-green-100 has-[:checked]:border-green-500">
            <input type="radio" name="課程節奏" value="剛好" class="sr-only"> ✅ 剛好
          </label>
          <label class="flex-1 text-center border rounded-xl py-3 cursor-pointer hover:bg-blue-50 has-[:checked]:bg-blue-100 has-[:checked]:border-blue-500">
            <input type="radio" name="課程節奏" value="太慢" class="sr-only"> 🐢 太慢
          </label>
        </div>
      </div>

      <button id="submitBtn" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl transition">
        <span id="btnText">送出反饋</span>
      </button>
    </form>

    <div id="success" class="success text-center py-12">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-xl font-bold text-green-600 mb-2">謝謝你的回饋！</h2>
      <p class="text-gray-500 text-sm">老師已收到，繼續加油 💪</p>
      <button onclick="location.reload()" class="mt-6 text-blue-600 underline text-sm">重新填寫</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('surveyForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const success = document.getElementById('success');

    // ↓↓↓ 把這行換成你第二步拿到的 Web App URL ↓↓↓
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwad41r-0RJXTbtRkD_CCbGokaZqiwAdDjsiT6WgFpagkVinxN-v4G8hY4oxguNatKB/exec';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      btnText.textContent = '傳送中…';
      try {
        const res = await fetch(scriptURL, {
          method: 'POST',
          body: new FormData(form)
        });
        const data = await res.json();
        if (data.result === 'success') {
          form.style.display = 'none';
          success.style.display = 'block';
        } else {
          alert('提交失敗，請稍後再試');
        }
      } catch (err) {
        alert('網路錯誤，請檢查網路');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = '送出反饋';
      }
    });
  </script>
</body>
</html>
